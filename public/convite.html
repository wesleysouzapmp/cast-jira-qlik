<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="panel">
      <h1 id="titulo">Criar conta</h1>
      <p id="sub" class="muted">Verificando o convite…</p>
      <form id="form" autocomplete="on" hidden>
        <label id="lblNome">Nome
          <input id="nome" name="nome" type="text" autocomplete="name">
        </label>
        <label id="lblEmail">E-mail
          <input id="email" name="email" type="email" autocomplete="username">
        </label>
        <label>Senha (mínimo 10 caracteres)
          <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <button class="primary" type="submit" id="enviar">Continuar</button>
      </form>
      <p id="msg" class="msg err" role="alert"></p>
    </section>
  </main>
  <aside class="auth-art" aria-hidden="true"><div><span class="o"></span><span class="o"></span><span class="o"></span><span class="o"></span><span class="o"></span><span class="x"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="f"></span><span class="v"></span><span class="c"></span><span></span><span class="a"></span><span class="a"></span><span class="c"></span><span class="a"></span><span></span><span></span><span></span><span class="o"></span><span class="o"></span><span class="o"></span><span class="o"></span></div></aside>
  <script type="module" src="convite.js"></script>
</body>
</html>
